spring.application.name=vox

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vox}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=${SQL_INIT_MODE:never}

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://user:user@localhost:5672/}
spring.rabbitmq.listener.simple.retry.enabled=${RABBITMQ_RETRY_ENABLED:true}
spring.rabbitmq.listener.simple.retry.initial-interval=${RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
spring.rabbitmq.listener.simple.retry.max-retries=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.max-interval=${RABBITMQ_RETRY_MAX_INTERVAL:10000}
spring.rabbitmq.listener.simple.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:${spring.mail.username}}

app.instance-id=${APP_INSTANCE_ID:${random.uuid}}
app.clients.url=${CLIENT_URLS:http://localhost:4200}

security.jwt.secret=${JWT_SECRET:vox}
security.jwt.expires-in-minutes=${JWT_EXPIRES_IN_MINUTES:3600}
security.cookie.secure=${COOKIE_SECURE:false}
security.cookie.same-site=${COOKIE_SAME_SITE:Strict}