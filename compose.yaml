services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: development
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/vox
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://cache:6379
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: true
      JPA_FORMAT_SQL: true
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
      message-br:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vox
    volumes:
      - vox-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "vox"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vox-data: